# docker/sql-server-local.yml — local Microsoft SQL Server for Notepatra testing.
#
# Spins up SQL Server 2022 bound to 127.0.0.1:1433 (NOT 0.0.0.0 — local-only).
# Used by Notepatra's Data Analyst Mode + query_sql tool development and
# end-to-end tests. Not for production use.
#
# Quick start:
#   docker compose -f docker/sql-server-local.yml up -d
#   bash scripts/sql-server-local-setup.sh    # seeds NotepatraTest db
#   # Connect from Notepatra: Settings → Data → Manage Connections → New
#   #   Driver: QODBC
#   #   Host: localhost
#   #   Port: 1433
#   #   Database: NotepatraTest
#   #   Username: sa
#   #   Password: Notepatra_Local_Dev!2026
#   #   Options: DRIVER={ODBC Driver 18 for SQL Server};Encrypt=no
#
# Architecture notes:
#   - The image is Linux x64 only. On Apple Silicon (ARM64) it runs under
#     Rosetta or QEMU — works but slow (~3x cold-start). Microsoft has not
#     shipped a native ARM64 SQL Server image as of 2026-Q2.
#   - mcr.microsoft.com/azure-sql-edge previously offered ARM64 but was
#     deprecated by Microsoft in 2024; do not use it for new work.
#
# Stopping / cleaning up:
#   docker compose -f docker/sql-server-local.yml down          # stop + remove
#   docker compose -f docker/sql-server-local.yml down -v       # stop + remove + drop volume

services:
  sqlserver:
    # SQL Server 2022 Developer edition — free for dev/test, full feature set.
    # 2022-latest tracks the latest cumulative update.
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: notepatra-mssql-local
    # MSSQL_PID=Developer: free Developer edition. Express also works but
    # has 10 GB DB-size and 1 GB RAM caps that bite during E2E tests.
    environment:
      ACCEPT_EULA: "Y"
      # Dev password — must satisfy SQL Server's default policy (8+ chars,
      # mixed case, digits, special). If you change this, also update
      # scripts/sql-server-local-setup.sh AND the "SQL Server (Notepatra
      # local Docker)" preset in src/dbconnections.cpp so all three stay
      # aligned with the running container.
      MSSQL_SA_PASSWORD: "Notepatra_Local_Dev!2026"
      MSSQL_PID: Developer
      # Speed up cold-start by skipping the optional FILESTREAM feature
      # (we don't use it from Notepatra).
      MSSQL_ENABLE_HADR: "0"
    ports:
      # localhost-bind is deliberate. Without it Docker exposes 1433 on
      # ALL interfaces (0.0.0.0:1433) — a credential-discovery attack
      # surface on any laptop that joins a coffee-shop wifi.
      #
      # External port defaults to 14330 (NOT 1433) so this harness can
      # coexist with another local SQL Server (e.g. a project-specific
      # container already bound to 1433). Override with NOTEPATRA_MSSQL_PORT
      # if 14330 is also taken.
      - "127.0.0.1:${NOTEPATRA_MSSQL_PORT:-14330}:1433"
    volumes:
      # Persist data + logs across container restarts so seeded test data
      # survives a `docker compose down` (use `down -v` to actually wipe).
      - notepatra-mssql-data:/var/opt/mssql
    healthcheck:
      # /opt/mssql-tools/bin/sqlcmd (or 18/ for newer images) is shipped
      # inside the container. SELECT 1 with -b makes it exit non-zero on
      # any failure so the healthcheck flips to "unhealthy" correctly.
      test: ["CMD-SHELL",
             "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  notepatra-mssql-data:
    name: notepatra-mssql-local-data
