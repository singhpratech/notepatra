name: IndexNow ping

# Tells Bing / Yandex / Seznam / Naver / Yep / DuckDuckGo (via Bing) to recrawl
# notepatra.org whenever the docs/ folder changes. Free, no API key, no signup.
# https://www.indexnow.org/

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Submit URL list to IndexNow
        run: |
          set -euo pipefail
          # Submit a JSON payload listing all the canonical URLs we want
          # search engines to recrawl. The 'key' must match the contents of
          # docs/4e0be99a5f38f170e2721278d7f518f2.txt (a static challenge file
          # served at https://notepatra.org/<key>.txt that proves we own the
          # domain). All major IndexNow endpoints share the same submission
          # protocol — pinging api.indexnow.org distributes to all of them.
          #
          # urlList: real pages only. The eight "#download"/"#features" entries
          # that used to sit here are the SAME page to a crawler — sitemap.xml
          # rule 2 says exactly that about fragments, and it is no less true
          # for IndexNow. docs.html, mcp.html and enterprise.html were live and
          # indexable for releases and had never been submitted.
          #
          # The payload is pure JSON: no comments inside it. Comment lines in
          # the body made every ping since #38 a silent HTTP 400.
          cat > indexnow.json <<'JSON'
          {
            "host": "notepatra.org",
            "key": "4e0be99a5f38f170e2721278d7f518f2",
            "keyLocation": "https://notepatra.org/4e0be99a5f38f170e2721278d7f518f2.txt",
            "urlList": [
              "https://notepatra.org/",
              "https://notepatra.org/docs.html",
              "https://notepatra.org/mcp.html",
              "https://notepatra.org/enterprise.html",
              "https://notepatra.org/sitemap.xml"
            ]
          }
          JSON
          python3 -I -c 'import json, sys; json.load(open(sys.argv[1]))' indexnow.json
          code=$(curl -sS -o indexnow-response.txt -w '%{http_code}' -X POST \
            "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @indexnow.json) || code="000"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "IndexNow ping accepted (HTTP $code)"
          else
            echo "::error::IndexNow ping failed with HTTP $code"
            cat indexnow-response.txt 2>/dev/null || true
            exit 1
          fi

      - name: Note on Google (its ping endpoint no longer exists)
        run: |
          # Google retired the sitemap ping endpoint in June 2023 (it now
          # returns 404). Google discovers the sitemap from robots.txt; the
          # only manual lever is Search Console. IndexNow above still covers
          # Bing, Yandex, Seznam and Naver.
          echo "Google: no ping endpoint — use Search Console > Sitemaps"
