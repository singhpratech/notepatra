name: Build Notepatra

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake \
            qtbase5-dev libqscintilla2-qt5-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust core
        run: cd rust-core && cargo build --release

      - name: Build C++
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Test
        run: |
          ls -lh build/notepatra
          file build/notepatra
          build/notepatra --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepatra-linux-x64
          path: build/notepatra

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install qt@5 qscintilla2 cmake || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust core
        run: cd rust-core && cargo build --release

      - name: Build C++
        run: |
          QT_PATH=$(brew --prefix qt@5 2>/dev/null || echo "/opt/homebrew/opt/qt@5")
          export PATH="$QT_PATH/bin:$PATH"
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_PATH"
          make -j$(sysctl -n hw.ncpu)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepatra-macos-x64
          path: build/notepatra

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Package
        run: |
          chmod +x notepatra-linux-x64/notepatra
          tar czf notepatra-linux-x64.tar.gz -C notepatra-linux-x64 notepatra
          tar czf notepatra-macos-x64.tar.gz -C notepatra-macos-x64 notepatra

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            notepatra-linux-x64.tar.gz
            notepatra-macos-x64.tar.gz
          generate_release_notes: true
