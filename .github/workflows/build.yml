name: Build Notepatra

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake \
            qtbase5-dev libqscintilla2-qt5-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Audit Rust dependencies (cargo-audit)
        run: |
          # Install cargo-audit to scan Cargo.lock for known CVEs in transitive
          # deps. Treat advisories as warnings (don't break the build) but make
          # them visible in the GH Actions summary.
          cargo install --locked cargo-audit 2>&1 | tail -5 || true
          cd rust-core && cargo audit || echo "::warning::cargo-audit reported advisories — review them"

      - name: Build Rust core
        run: cd rust-core && cargo build --release

      - name: Build C++
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Test
        run: |
          ls -lh build/notepatra
          file build/notepatra
          build/notepatra --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepatra-linux-x64
          path: build/notepatra

  # Note: Intel Mac (macos-13) build was removed — Apple stopped selling Intel Macs in 2023,
  # and the macos-13 free runner has been unreliable. Apple Silicon build covers all current
  # Macs (M1/M2/M3/M4). Intel Mac users can build from source.

  build-macos-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install qt@5 cmake
          QT_PATH=$(brew --prefix qt@5)
          export PATH="$QT_PATH/bin:$PATH"
          export PKG_CONFIG_PATH="$QT_PATH/lib/pkgconfig:$PKG_CONFIG_PATH"
          curl -L -o qscintilla.tar.gz \
            "https://www.riverbankcomputing.com/static/Downloads/QScintilla/2.14.1/QScintilla_src-2.14.1.tar.gz"
          tar xzf qscintilla.tar.gz
          cd QScintilla_src-2.14.1/src
          "$QT_PATH/bin/qmake" qscintilla.pro
          make VERBOSE=1 2>&1 | tail -200
          sudo make install
          echo "=== Verify QScintilla install ==="
          ls -la "$QT_PATH/lib/"libqscintilla2* 2>/dev/null || true
          ls -la "$QT_PATH/include/Qsci/" 2>/dev/null | head -5 || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust core
        run: cd rust-core && cargo build --release

      - name: Build C++
        run: |
          QT_PATH=$(brew --prefix qt@5)
          export PATH="$QT_PATH/bin:$PATH"

          # Find QScintilla wherever make install put it
          echo "=== Searching for QScintilla ==="
          find /opt/homebrew /usr/local -name "libqscintilla2*" 2>/dev/null
          find /opt/homebrew /usr/local -name "qsciscintilla.h" 2>/dev/null

          QSC_LIB=$(find /opt/homebrew /usr/local -name "libqscintilla2_qt5*dylib" 2>/dev/null | head -1)
          [ -z "$QSC_LIB" ] && QSC_LIB=$(find /opt/homebrew /usr/local -name "libqscintilla2*dylib" 2>/dev/null | head -1)
          [ -z "$QSC_LIB" ] && QSC_LIB=$(find /opt/homebrew /usr/local -name "libqscintilla2*" -not -name "*.dSYM" 2>/dev/null | head -1)

          QSC_HDR=$(find /opt/homebrew /usr/local -name "qsciscintilla.h" 2>/dev/null | head -1)
          QSC_INC=$(dirname $(dirname "$QSC_HDR"))

          echo "Lib: $QSC_LIB"
          echo "Inc: $QSC_INC"

          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PATH" \
            -DQSCINTILLA_INCLUDE="$QSC_INC" \
            -DQSCINTILLA_LIB="$QSC_LIB"
          make VERBOSE=1 2>&1 | tail -200

      - name: Create DMG
        run: |
          QT_PATH=/opt/homebrew/opt/qt@5
          export PATH="$QT_PATH/bin:$PATH"
          # Bundle Qt frameworks into the app
          macdeployqt build/Notepatra.app 2>/dev/null || true
          # Copy QScintilla dylib into app bundle
          mkdir -p build/Notepatra.app/Contents/Frameworks
          cp "$QT_PATH/lib/libqscintilla2_qt5."*.dylib build/Notepatra.app/Contents/Frameworks/ 2>/dev/null || true
          # Create DMG
          hdiutil create -volname "Notepatra" -srcfolder build/Notepatra.app -ov -format UDZO build/Notepatra.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: notepatra-macos-arm64
          path: build/Notepatra.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt5
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          dir: '${{ runner.temp }}/Qt'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build QScintilla via CMake wrapper
        id: qscintilla
        shell: pwsh
        run: |
          # Use farleyrunkel/QScintilla — a CMake wrapper around the upstream
          # source that auto-detects Qt5 and exports a proper CMake target.
          # Replaces the fragile qmake/nmake approach that silently failed in cmd.
          $qtRoot = (Resolve-Path "$env:Qt5_DIR\..\..\..").Path
          Write-Host "Qt root: $qtRoot"

          $qsciDir = "$env:RUNNER_TEMP\qsci-src"
          $qsciInstall = "$env:RUNNER_TEMP\qsci-install"

          git clone --depth 1 https://github.com/farleyrunkel/QScintilla.git $qsciDir
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::git clone failed"; exit 1 }

          cmake -S $qsciDir -B "$qsciDir\build" -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$qtRoot" `
            "-DCMAKE_INSTALL_PREFIX=$qsciInstall"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::QScintilla cmake configure failed"; exit 1 }

          cmake --build "$qsciDir\build" --config Release
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::QScintilla cmake build failed"; exit 1 }

          cmake --install "$qsciDir\build" --config Release
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::QScintilla cmake install failed"; exit 1 }

          Write-Host "=== Installed QScintilla files ==="
          Get-ChildItem -Path $qsciInstall -Recurse | Select-Object FullName | Format-Table -AutoSize

          # Find the lib and include dir from the install tree
          $lib = (Get-ChildItem -Path $qsciInstall -Recurse -Filter "qscintilla2_qt5*.lib" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $lib) {
            $lib = (Get-ChildItem -Path $qsciInstall -Recurse -Filter "*qscintilla2*.lib" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $lib) { Write-Host "::error::qscintilla lib not found in install tree"; exit 1 }

          $hdr = (Get-ChildItem -Path $qsciInstall -Recurse -Filter "qsciscintilla.h" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $hdr) { Write-Host "::error::qsciscintilla.h not found in install tree"; exit 1 }
          # find_path-style: dirname(dirname(...)) so the result contains Qsci/
          $inc = (Split-Path -Parent (Split-Path -Parent $hdr))

          $check = Join-Path $inc "Qsci\qsciscintilla.h"
          if (-not (Test-Path $check)) { Write-Host "::error::sanity check failed: $check does not exist"; exit 1 }

          Write-Host "QScintilla lib: $lib"
          Write-Host "QScintilla inc: $inc"
          "QSC_LIB=$lib" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "QSC_INC=$inc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "QT_ROOT=$qtRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "QSC_INSTALL=$qsciInstall" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust core
        shell: cmd
        run: cd rust-core && cargo build --release

      - name: Build C++ with CMake (MSVC)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          Set-Location build
          # CMAKE_PREFIX_PATH must point to the Qt root, NOT to Qt5_DIR
          # (Qt5_DIR is <root>/lib/cmake/Qt5 — too deep). Use the root so
          # find_package(Qt5) and find_path/find_library both work.
          $qtRoot = "${{ steps.qscintilla.outputs.QT_ROOT }}"
          cmake .. -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_PREFIX_PATH=$qtRoot" `
            "-DQSCINTILLA_INCLUDE=${{ steps.qscintilla.outputs.QSC_INC }}" `
            "-DQSCINTILLA_LIB=${{ steps.qscintilla.outputs.QSC_LIB }}" 2>&1 | Tee-Object -FilePath ../cmake-configure.log
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::cmake configure failed"; exit 1 }
          cmake --build . --config Release 2>&1 | Tee-Object -FilePath ../cmake-build.log
          $buildExit = $LASTEXITCODE
          Write-Host "=== First 100 lines of cmake build output ==="
          Get-Content ../cmake-build.log | Select-Object -First 100 | ForEach-Object { Write-Host $_ }
          Write-Host "=== Errors and warnings only ==="
          Get-Content ../cmake-build.log | Select-String -Pattern "error|fatal" | Select-Object -First 50 | ForEach-Object { Write-Host $_ }
          Write-Host "=== Last 100 lines of cmake build output ==="
          Get-Content ../cmake-build.log -Tail 100 | ForEach-Object { Write-Host $_ }
          if ($buildExit -ne 0) { Write-Host "::error::cmake build failed (exit $buildExit)"; exit 1 }
          Write-Host "=== Searching for notepatra.exe ==="
          Get-ChildItem -Path . -Recurse -Filter "notepatra.exe" | ForEach-Object { Write-Host $_.FullName }

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            cmake-configure.log
            cmake-build.log
          if-no-files-found: ignore

      - name: Verify exe and bundle Qt + QScintilla DLLs
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter "notepatra.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Host "::error::notepatra.exe not found anywhere under build/"
            Write-Host "=== build dir contents ==="
            Get-ChildItem -Path build -Recurse | Select-Object FullName
            exit 1
          }
          Write-Host "Found: $($exe.FullName) ($([math]::Round($exe.Length / 1MB, 2)) MB)"
          $outDir = "notepatra-win"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          Copy-Item $exe.FullName "$outDir/"
          # Run windeployqt to bundle Qt DLLs
          & windeployqt "$outDir/notepatra.exe"
          # Also copy qscintilla2_qt5.dll from the QScintilla install tree
          $qsciInstall = "${{ steps.qscintilla.outputs.QSC_INSTALL }}"
          $qsciDll = Get-ChildItem -Path $qsciInstall -Recurse -Filter "qscintilla2_qt5*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($qsciDll) {
            Copy-Item $qsciDll.FullName "$outDir/"
            Write-Host "Copied QScintilla DLL: $($qsciDll.FullName)"
          } else {
            Write-Host "::warning::qscintilla2_qt5.dll not found — exe may not run"
          }
          Write-Host "=== Package contents ==="
          Get-ChildItem $outDir | Format-Table Name, Length
          $totalSize = (Get-ChildItem $outDir -Recurse | Measure-Object Length -Sum).Sum / 1MB
          Write-Host "Total package size: $([math]::Round($totalSize, 1)) MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepatra-windows-x64
          path: notepatra-win/

  release:
    needs: [build-linux, build-macos-arm, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write    # publish the release
      id-token: write    # cosign keyless OIDC signing
      attestations: write  # SLSA build provenance
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Package
        run: |
          ls -la
          chmod +x notepatra-linux-x64/notepatra || true
          tar czf notepatra-linux-x64.tar.gz -C notepatra-linux-x64 notepatra
          cp notepatra-macos-arm64/Notepatra.dmg notepatra-macos-arm64.dmg
          if [ -d notepatra-windows-x64 ]; then
            cd notepatra-windows-x64 && zip -r ../notepatra-windows-x64.zip . && cd ..
          fi
          ls -la *.tar.gz *.dmg 2>/dev/null
          ls -la *.zip 2>/dev/null || true

      - name: Generate SHA-256 checksums
        run: |
          # Generate a single SHA256SUMS file in the standard format that
          # `sha256sum -c` understands. Users can verify with:
          #   sha256sum -c SHA256SUMS
          for f in notepatra-linux-x64.tar.gz notepatra-macos-arm64.dmg notepatra-windows-x64.zip; do
            [ -f "$f" ] && sha256sum "$f" >> SHA256SUMS
          done
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign artifacts with cosign (keyless OIDC)
        env:
          COSIGN_YES: "true"
        run: |
          # Keyless signing via Sigstore: identity comes from the GitHub
          # Actions OIDC token, no long-lived secrets. Each .sig is the
          # detached signature, each .pem is the short-lived cert that
          # ties the signature to this repo + workflow + commit SHA.
          for f in notepatra-linux-x64.tar.gz notepatra-macos-arm64.dmg notepatra-windows-x64.zip SHA256SUMS; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done
          ls -la *.sig *.pem

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            notepatra-linux-x64.tar.gz
            notepatra-macos-arm64.dmg
            notepatra-windows-x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            notepatra-linux-x64.tar.gz
            notepatra-macos-arm64.dmg
            notepatra-windows-x64.zip
            SHA256SUMS
            notepatra-linux-x64.tar.gz.sig
            notepatra-linux-x64.tar.gz.pem
            notepatra-macos-arm64.dmg.sig
            notepatra-macos-arm64.dmg.pem
            notepatra-windows-x64.zip.sig
            notepatra-windows-x64.zip.pem
            SHA256SUMS.sig
            SHA256SUMS.pem
          fail_on_unmatched_files: false
          generate_release_notes: true
          body: |
            ## Verifying this release

            ### SHA-256 checksums
            ```
            sha256sum -c SHA256SUMS
            ```

            ### Cosign signature (keyless, Sigstore)
            ```
            cosign verify-blob \
              --certificate-identity-regexp '^https://github.com/singhpratech/notepatra/' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --certificate notepatra-linux-x64.tar.gz.pem \
              --signature  notepatra-linux-x64.tar.gz.sig \
              notepatra-linux-x64.tar.gz
            ```

            ### Build provenance (SLSA)
            ```
            gh attestation verify notepatra-linux-x64.tar.gz --owner singhpratech
            ```

            See [SECURITY.md](https://github.com/singhpratech/notepatra/blob/main/SECURITY.md) for the full verification guide.
