name: Build Notepatra

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake \
            qtbase5-dev libqscintilla2-qt5-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust core
        run: cd rust-core && cargo build --release

      - name: Build C++
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Test
        run: |
          ls -lh build/notepatra
          file build/notepatra
          build/notepatra --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepatra-linux-x64
          path: build/notepatra

  # Note: Intel Mac (macos-13) build was removed — Apple stopped selling Intel Macs in 2023,
  # and the macos-13 free runner has been unreliable. Apple Silicon build covers all current
  # Macs (M1/M2/M3/M4). Intel Mac users can build from source.

  build-macos-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install qt@5 cmake
          QT_PATH=$(brew --prefix qt@5)
          export PATH="$QT_PATH/bin:$PATH"
          export PKG_CONFIG_PATH="$QT_PATH/lib/pkgconfig:$PKG_CONFIG_PATH"
          curl -L -o qscintilla.tar.gz \
            "https://www.riverbankcomputing.com/static/Downloads/QScintilla/2.14.1/QScintilla_src-2.14.1.tar.gz"
          tar xzf qscintilla.tar.gz
          cd QScintilla_src-2.14.1/src
          "$QT_PATH/bin/qmake" qscintilla.pro
          make VERBOSE=1 2>&1 | tail -200
          sudo make install
          echo "=== Verify QScintilla install ==="
          ls -la "$QT_PATH/lib/"libqscintilla2* 2>/dev/null || true
          ls -la "$QT_PATH/include/Qsci/" 2>/dev/null | head -5 || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust core
        run: cd rust-core && cargo build --release

      - name: Build C++
        run: |
          QT_PATH=$(brew --prefix qt@5)
          export PATH="$QT_PATH/bin:$PATH"

          # Find QScintilla wherever make install put it
          echo "=== Searching for QScintilla ==="
          find /opt/homebrew /usr/local -name "libqscintilla2*" 2>/dev/null
          find /opt/homebrew /usr/local -name "qsciscintilla.h" 2>/dev/null

          QSC_LIB=$(find /opt/homebrew /usr/local -name "libqscintilla2_qt5*dylib" 2>/dev/null | head -1)
          [ -z "$QSC_LIB" ] && QSC_LIB=$(find /opt/homebrew /usr/local -name "libqscintilla2*dylib" 2>/dev/null | head -1)
          [ -z "$QSC_LIB" ] && QSC_LIB=$(find /opt/homebrew /usr/local -name "libqscintilla2*" -not -name "*.dSYM" 2>/dev/null | head -1)

          QSC_HDR=$(find /opt/homebrew /usr/local -name "qsciscintilla.h" 2>/dev/null | head -1)
          QSC_INC=$(dirname $(dirname "$QSC_HDR"))

          echo "Lib: $QSC_LIB"
          echo "Inc: $QSC_INC"

          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PATH" \
            -DQSCINTILLA_INCLUDE="$QSC_INC" \
            -DQSCINTILLA_LIB="$QSC_LIB"
          make VERBOSE=1 2>&1 | tail -200

      - name: Create DMG
        run: |
          QT_PATH=/opt/homebrew/opt/qt@5
          export PATH="$QT_PATH/bin:$PATH"
          # Bundle Qt frameworks into the app
          macdeployqt build/Notepatra.app 2>/dev/null || true
          # Copy QScintilla dylib into app bundle
          mkdir -p build/Notepatra.app/Contents/Frameworks
          cp "$QT_PATH/lib/libqscintilla2_qt5."*.dylib build/Notepatra.app/Contents/Frameworks/ 2>/dev/null || true
          # Create DMG
          hdiutil create -volname "Notepatra" -srcfolder build/Notepatra.app -ov -format UDZO build/Notepatra.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: notepatra-macos-arm64
          path: build/Notepatra.dmg

  build-windows:
    runs-on: windows-latest
    # Windows build is allowed to fail for now — MSVC + QScintilla source build
    # is finicky. Linux + Mac ARM ship in v0.1.0; Windows lands in v0.1.1.
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt5
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          dir: '${{ runner.temp }}/Qt'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build QScintilla from source
        shell: cmd
        run: |
          curl -L -o qscintilla.tar.gz "https://www.riverbankcomputing.com/static/Downloads/QScintilla/2.14.1/QScintilla_src-2.14.1.tar.gz"
          tar xzf qscintilla.tar.gz
          cd QScintilla_src-2.14.1\src
          qmake qscintilla.pro
          nmake
          nmake install

      - name: Locate QScintilla
        id: qscintilla
        shell: pwsh
        run: |
          # install-qt-action sets Qt5_DIR to the cmake config dir, e.g.
          # .../lib/cmake/Qt5 — the Qt root is three levels up
          $qtRoot = (Resolve-Path "$env:Qt5_DIR\..\..\..").Path
          Write-Host "Qt root = $qtRoot"

          $lib = Join-Path $qtRoot "lib\qscintilla2_qt5.lib"
          $inc = Join-Path $qtRoot "include"

          if (-not (Test-Path $lib)) {
            Write-Host "Lib not at expected path, searching..."
            $found = Get-ChildItem -Path $qtRoot -Recurse -Filter "qscintilla2_qt5.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $lib = $found.FullName } else { Write-Error "QScintilla lib not found"; exit 1 }
          }
          if (-not (Test-Path (Join-Path $inc "Qsci"))) {
            Write-Host "Headers not at expected path, searching..."
            $hdr = Get-ChildItem -Path $qtRoot -Recurse -Filter "qsciscintilla.h" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hdr) { $inc = $hdr.Directory.Parent.FullName } else { Write-Error "QScintilla headers not found"; exit 1 }
          }

          Write-Host "QScintilla lib: $lib"
          Write-Host "QScintilla inc: $inc"
          "QSC_LIB=$lib" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "QSC_INC=$inc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust core
        shell: cmd
        run: cd rust-core && cargo build --release

      - name: Build C++ with CMake (MSVC)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          Set-Location build
          cmake .. -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_PREFIX_PATH=$env:Qt5_DIR" `
            "-DQSCINTILLA_INCLUDE=${{ steps.qscintilla.outputs.QSC_INC }}" `
            "-DQSCINTILLA_LIB=${{ steps.qscintilla.outputs.QSC_LIB }}" 2>&1 | Tee-Object -FilePath ../cmake-configure.log
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::cmake configure failed"; exit 1 }
          cmake --build . --config Release 2>&1 | Tee-Object -FilePath ../cmake-build.log
          $buildExit = $LASTEXITCODE
          Write-Host "=== Last 200 lines of cmake build output ==="
          Get-Content ../cmake-build.log -Tail 200 | ForEach-Object { Write-Host $_ }
          if ($buildExit -ne 0) { Write-Host "::error::cmake build failed (exit $buildExit)"; exit 1 }
          Write-Host "=== Searching for notepatra.exe ==="
          Get-ChildItem -Path . -Recurse -Filter "notepatra.exe" | ForEach-Object { Write-Host $_.FullName }

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            cmake-configure.log
            cmake-build.log
          if-no-files-found: ignore

      - name: Post build log to public gist on failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path cmake-build.log)) {
            Write-Host "No cmake-build.log to post"
            exit 0
          }
          $log = Get-Content cmake-build.log -Raw
          if ($log.Length -gt 60000) { $log = "...(truncated)...`n" + $log.Substring($log.Length - 60000) }
          # Filter to errors only
          $errors = (Get-Content cmake-build.log | Select-String -Pattern "error|Error|fatal" | Select-Object -First 200) -join "`n"
          $body = @"
          # Notepatra Windows Build Failure

          - SHA: $env:GITHUB_SHA
          - Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID

          ## Errors only

          ``````
          $errors
          ``````

          ## Last 60 KB of build log

          ``````
          $log
          ``````
          "@
          $body | Out-File -FilePath build-log.md -Encoding utf8

          # Update issue #1 (create if it doesn't exist) with the log so it's readable via public API
          $exists = gh issue view 1 --repo $env:GITHUB_REPOSITORY --json number 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh issue edit 1 --repo $env:GITHUB_REPOSITORY --body-file build-log.md
            Write-Host "Updated issue #1"
          } else {
            gh issue create --repo $env:GITHUB_REPOSITORY --title "Windows CI build log (auto)" --body-file build-log.md
            Write-Host "Created new issue"
          }

      - name: Verify exe and bundle Qt DLLs
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter "notepatra.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Host "::error::notepatra.exe not found anywhere under build/"
            Write-Host "=== build dir contents ==="
            Get-ChildItem -Path build -Recurse | Select-Object FullName
            exit 1
          }
          Write-Host "Found: $($exe.FullName) ($([math]::Round($exe.Length / 1MB, 2)) MB)"
          $outDir = "notepatra-win"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          Copy-Item $exe.FullName "$outDir/"
          # Run windeployqt to bundle Qt DLLs
          & windeployqt "$outDir/notepatra.exe"
          Write-Host "=== Package contents ==="
          Get-ChildItem $outDir | Format-Table Name, Length
          $totalSize = (Get-ChildItem $outDir -Recurse | Measure-Object Length -Sum).Sum / 1MB
          Write-Host "Total package size: $([math]::Round($totalSize, 1)) MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepatra-windows-x64
          path: notepatra-win/

  release:
    # Windows is allowed to fail; release only requires linux + mac-arm.
    needs: [build-linux, build-macos-arm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Package
        run: |
          ls -la
          chmod +x notepatra-linux-x64/notepatra || true
          tar czf notepatra-linux-x64.tar.gz -C notepatra-linux-x64 notepatra
          cp notepatra-macos-arm64/Notepatra.dmg notepatra-macos-arm64.dmg
          # Windows artifact is optional — bundle if present, skip if not.
          if [ -d notepatra-windows-x64 ]; then
            cd notepatra-windows-x64 && zip -r ../notepatra-windows-x64.zip . && cd ..
          fi
          ls -la *.tar.gz *.dmg 2>/dev/null
          ls -la *.zip 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            notepatra-linux-x64.tar.gz
            notepatra-macos-arm64.dmg
            notepatra-windows-x64.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
