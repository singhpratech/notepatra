name: Build Notepatra

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake \
            qtbase5-dev libqscintilla2-qt5-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust core
        run: cd rust-core && cargo build --release

      - name: Build C++
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Test
        run: |
          ls -lh build/notepatra
          file build/notepatra
          build/notepatra --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepatra-linux-x64
          path: build/notepatra

  build-macos-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install qt@5 cmake
          # Homebrew's qscintilla2 links against Qt6, not Qt5.
          # We must build QScintilla from source against Qt5.
          QT_PATH=$(brew --prefix qt@5)
          export PATH="$QT_PATH/bin:$PATH"
          export PKG_CONFIG_PATH="$QT_PATH/lib/pkgconfig:$PKG_CONFIG_PATH"

          # Download and build QScintilla 2.14.1 from source against Qt5
          curl -L -o qscintilla.tar.gz \
            "https://www.riverbankcomputing.com/static/Downloads/QScintilla/2.14.1/QScintilla_src-2.14.1.tar.gz"
          tar xzf qscintilla.tar.gz
          cd QScintilla_src-2.14.1/src
          "$QT_PATH/bin/qmake" qscintilla.pro
          make -j$(sysctl -n hw.ncpu)
          sudo make install
          echo "=== Installed QScintilla files ==="
          ls -la "$QT_PATH/lib/"libqscintilla2* 2>/dev/null || true
          ls -la "$QT_PATH/include/Qsci/" 2>/dev/null | head -5 || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust core
        run: cd rust-core && cargo build --release

      - name: Build C++
        run: |
          QT_PATH=$(brew --prefix qt@5)
          export PATH="$QT_PATH/bin:$PATH"

          echo "=== Qt5 path ==="
          echo "$QT_PATH"
          qmake --version

          echo "=== QScintilla files ==="
          find "$QT_PATH" -name "libqscintilla2*" 2>/dev/null || true
          find "$QT_PATH" -name "qsciscintilla.h" 2>/dev/null || true
          # Also check /usr/local for QScintilla installed by 'make install'
          find /usr/local -name "libqscintilla2*" 2>/dev/null || true
          find /usr/local -name "qsciscintilla.h" 2>/dev/null || true

          # Determine where QScintilla was installed
          # 'make install' for QScintilla typically installs into the Qt prefix
          QSC_INC="$QT_PATH/include"
          QSC_LIB=""
          for dir in "$QT_PATH/lib" "/usr/local/lib"; do
            if [ -f "$dir/libqscintilla2_qt5.dylib" ]; then
              QSC_LIB="$dir/libqscintilla2_qt5.dylib"
              break
            elif [ -f "$dir/libqscintilla2_qt5.a" ]; then
              QSC_LIB="$dir/libqscintilla2_qt5.a"
              break
            fi
          done
          # Fallback: find it anywhere
          if [ -z "$QSC_LIB" ]; then
            QSC_LIB=$(find "$QT_PATH" /usr/local -name "libqscintilla2_qt5*" -not -name "*.dSYM" 2>/dev/null | head -1)
          fi

          echo "=== Using QScintilla ==="
          echo "Include: $QSC_INC"
          echo "Lib: $QSC_LIB"

          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PATH" \
            -DQSCINTILLA_INCLUDE="$QSC_INC" \
            -DQSCINTILLA_LIB="$QSC_LIB"
          make -j$(sysctl -n hw.ncpu)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepatra-macos-x64
          path: build/Notepatra.app

  build-macos-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install qt@5 cmake
          QT_PATH=$(brew --prefix qt@5)
          export PATH="$QT_PATH/bin:$PATH"
          export PKG_CONFIG_PATH="$QT_PATH/lib/pkgconfig:$PKG_CONFIG_PATH"
          curl -L -o qscintilla.tar.gz \
            "https://www.riverbankcomputing.com/static/Downloads/QScintilla/2.14.1/QScintilla_src-2.14.1.tar.gz"
          tar xzf qscintilla.tar.gz
          cd QScintilla_src-2.14.1/src
          "$QT_PATH/bin/qmake" qscintilla.pro
          make -j$(sysctl -n hw.ncpu)
          sudo make install

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust core
        run: cd rust-core && cargo build --release

      - name: Build C++
        run: |
          QT_PATH=$(brew --prefix qt@5)
          export PATH="$QT_PATH/bin:$PATH"
          QSC_LIB=$(find "$QT_PATH" /usr/local /opt/homebrew -name "libqscintilla2_qt5*" -not -name "*.dSYM" 2>/dev/null | head -1)
          QSC_INC="$QT_PATH/include"
          [ ! -d "$QSC_INC/Qsci" ] && QSC_INC="/opt/homebrew/include"
          [ ! -d "$QSC_INC/Qsci" ] && QSC_INC="/usr/local/include"
          echo "Lib: $QSC_LIB | Inc: $QSC_INC"
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PATH" \
            -DQSCINTILLA_INCLUDE="$QSC_INC" \
            -DQSCINTILLA_LIB="$QSC_LIB"
          make -j$(sysctl -n hw.ncpu)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepatra-macos-arm64
          path: build/Notepatra.app

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt5
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          dir: '${{ runner.temp }}/Qt'

      - name: Build QScintilla from source
        shell: cmd
        run: |
          curl -L -o qscintilla.tar.gz "https://www.riverbankcomputing.com/static/Downloads/QScintilla/2.14.1/QScintilla_src-2.14.1.tar.gz"
          tar xzf qscintilla.tar.gz
          cd QScintilla_src-2.14.1\src
          call "%Qt5_DIR%\bin\qmake.exe" qscintilla.pro
          call "%Qt5_DIR%\..\..\..\..\..\..\Tools\QtCreator\bin\jom.exe" /J %NUMBER_OF_PROCESSORS% 2>nul || nmake
          nmake install

      - name: Locate QScintilla
        id: qscintilla
        shell: pwsh
        run: |
          # QScintilla installs into the Qt prefix by default
          $qtDir = $env:Qt5_DIR
          Write-Host "Qt5_DIR = $qtDir"

          # Search for the library
          $lib = Get-ChildItem -Path $qtDir -Recurse -Filter "qscintilla2_qt5.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $lib) {
            $lib = Get-ChildItem -Path $qtDir -Recurse -Filter "qscintilla2_qt5*.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          # Also check the QScintilla build directory
          if (-not $lib) {
            $lib = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\QScintilla_src-2.14.1" -Recurse -Filter "qscintilla2_qt5.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($lib) {
            Write-Host "Found QScintilla lib: $($lib.FullName)"
            "QSC_LIB=$($lib.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Error "QScintilla library not found"
            exit 1
          }

          # Search for the include directory (containing Qsci/qsciscintilla.h)
          $hdr = Get-ChildItem -Path $qtDir -Recurse -Filter "qsciscintilla.h" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $hdr) {
            $hdr = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\QScintilla_src-2.14.1" -Recurse -Filter "qsciscintilla.h" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($hdr) {
            # Include dir is the parent of the Qsci/ folder
            $incDir = $hdr.Directory.Parent.FullName
            Write-Host "Found QScintilla include: $incDir"
            "QSC_INC=$incDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Error "QScintilla headers not found"
            exit 1
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust core
        shell: cmd
        run: cd rust-core && cargo build --release

      - name: Build C++ with CMake (MSVC)
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_PREFIX_PATH="%Qt5_DIR%" ^
            -DQSCINTILLA_INCLUDE="${{ steps.qscintilla.outputs.QSC_INC }}" ^
            -DQSCINTILLA_LIB="${{ steps.qscintilla.outputs.QSC_LIB }}"
          cmake --build . --config Release

      - name: Test
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter "notepatra.exe" | Select-Object -First 1
          if ($exe) {
            Write-Host "Built: $($exe.FullName) ($([math]::Round($exe.Length / 1MB, 2)) MB)"
            & $exe.FullName --version 2>$null; $true
          } else {
            Write-Error "notepatra.exe not found"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepatra-windows-x64
          path: build/Release/notepatra.exe

  release:
    needs: [build-linux, build-macos-intel, build-macos-arm, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Package
        run: |
          chmod +x notepatra-linux-x64/notepatra
          tar czf notepatra-linux-x64.tar.gz -C notepatra-linux-x64 notepatra
          tar czf notepatra-macos-x64.tar.gz -C notepatra-macos-x64 Notepatra.app
          zip -j notepatra-windows-x64.zip notepatra-windows-x64/notepatra.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            notepatra-linux-x64.tar.gz
            notepatra-macos-x64.tar.gz
            notepatra-windows-x64.zip
          generate_release_notes: true
