name: Rust Quality

on:
  push:
    branches: [main]
    paths:
      - 'rust-core/**'
      - '.github/workflows/quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rust-core/**'
      - '.github/workflows/quality.yml'

jobs:
  rust-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-14

      - name: Install rustfmt + clippy
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cd rust-core && cargo fmt --check

      - name: Run clippy
        run: cd rust-core && cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cd rust-core && cargo test --release
