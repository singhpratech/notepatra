# cargo-audit configuration for rust-core.
[advisories]
# RUSTSEC-2023-0071 — "Marvin" timing side-channel in the `rsa` crate (no
# upstream fix). It affects RSA decryption/signing where an attacker can time
# the operation. Notepatra only *generates* RSA keys (ssh-key → rsa), locally
# and offline; it never decrypts or signs with them. Re-evaluate when rsa 0.10
# lands.
# RUSTSEC-2026-0387 — timing variability in crypto-bigint 0.5.5, reached via
# ssh-key 0.6 -> p256/p384 -> elliptic-curve 0.13. The fix (>=0.7.6) needs the
# next elliptic-curve major, which ssh-key 0.6 cannot use. Notepatra only
# generates ECDSA keys once, locally and offline, where no one can time it.
# Re-evaluate with ssh-key 0.7.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0387"]
