<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepatra — Coming Soon</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/singhpratech/notepatra/main/resources/notepatra-64.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A0A0A;
            color: #E0E0E0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container { max-width: 500px; padding: 40px; }
        img { width: 120px; height: 120px; border-radius: 24px; margin-bottom: 32px; }
        h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #39FF14, #00E676);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p { color: #888; font-size: 18px; line-height: 1.6; margin-bottom: 24px; }
        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(57,255,20,0.1);
            border: 1px solid rgba(57,255,20,0.3);
            border-radius: 100px;
            font-size: 13px;
            color: #39FF14;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://raw.githubusercontent.com/singhpratech/notepatra/main/resources/notepatra-512.png" alt="Notepatra">
        <h1>Notepatra</h1>
        <p>The code editor built for the AI era.<br>Something beautiful is coming.</p>
        <div class="badge">Coming Soon</div>
    </div>
</body>
</html>
