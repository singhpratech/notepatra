<!DOCTYPE html>
<html lang="en">
<head>
    <!-- First-party favicons. These MUST live on notepatra.org: Google's
         favicon crawler wants a stable, same-origin, crawlable icon, and
         /favicon.ico at the site root is the fallback it checks first.
         Before v0.1.128 the only declaration pointed at raw.githubusercontent.com
         — a different domain, a source-code CDN with a 5-minute cache — and
         /favicon.ico 404'd, so search results fell back to a blank globe. -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Notepatra</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #080E14;
            color: #E0E0E0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container { max-width: 480px; padding: 40px; }
        img { width: 96px; height: 96px; border-radius: 18px; margin-bottom: 24px; }
        h1 {
            font-size: 96px;
            font-weight: 800;
            background: linear-gradient(135deg, #39FF14, #1A73E8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        h2 { color: white; font-size: 24px; margin: 16px 0; }
        p { color: #8899AA; margin-bottom: 28px; }
        a {
            display: inline-block;
            padding: 12px 28px;
            background: #1A73E8;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        a:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://raw.githubusercontent.com/singhpratech/notepatra/main/resources/notepatra-256.png" alt="Notepatra">
        <h1>404</h1>
        <h2>Page not found</h2>
        <p>Like an unclosed bracket — looks like this page is missing.</p>
        <a href="/">← Back to Notepatra</a>
    </div>
</body>
</html>
