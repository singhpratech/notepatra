; Notepatra palette preview — synthetic; no real data
; ----------------------------------------------------
; This file demonstrates classic INI syntax.

# Global keys (no section header)
app_name = Notepatra
version  = 0.1.84
debug    = false

[general]
; Semicolon-style comment
locale       = en_US.UTF-8
timezone     = "UTC"
welcome_msg  = 'Hello, Alice!'
threads      = 4

[paths]
# Hash-style comment
install_dir  = /usr/local/bin
config_dir   = /home/alice/.config/notepatra
log_file     = /var/log/notepatra.log

[network]
host         = 192.0.2.10
port         = 8080
use_tls      = yes
retries      = 3
timeout_sec  = 30

[database]
; Some parsers also accept colon as separator
driver       : postgres
url          : postgres://example.com/db
pool_size    : 16
schema       : public

[users]
alice = admin
bob   = editor
carol = viewer

[features.editor]
tab_width      = 4
insert_spaces  = true
show_rulers    = 80,120

[features.ui]
theme    = dark
font     = "Fira Code"
fontsize = 13
