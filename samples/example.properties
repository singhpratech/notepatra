# Notepatra palette preview — synthetic; no real data
! Both '#' and '!' start comment lines in .properties files.

# App identity
app.name = Notepatra
app.version = 0.1.84
app.author = Alice
app.email : alice@example.com

# Colon and equals are both valid separators
server.host : 192.0.2.10
server.port = 8080
server.tls.enabled = true

# Continuation lines via trailing backslash
welcome.message = Welcome to Notepatra, \
                  the fast Linux-native editor \
                  brought to you by Alice and Bob.

# Spaces and escapes in keys
config\ path = /home/alice/.config/notepatra
log.file.path = /var/log/notepatra.log

# Unicode escapes (\uXXXX)
greeting.fr = Bonjour, Café Brûlée
greeting.jp = こんにちは

# Numeric / boolean-looking values are still strings
threads = 4
debug = false
ratio = 0.875

# Database
db.driver = postgres
db.url = jdbc:postgresql://example.com:5432/db
db.user = demo
db.password = synthetic-placeholder

# Lists are usually comma-separated
features.enabled = markdown, json, yaml, toml
rulers = 80, 100, 120

# Empty value
optional.note =

# Last line, no continuation
end.marker = done
